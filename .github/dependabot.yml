# 上游镜像发新版时开 PR，标签和摘要一起改；PR 跑插件自己的检查。
# PostGIS 的数据卷有数据库，大版本之间要迁移数据，自动升上去会让主人的数据读不出来：忽略大版本，手动升并在发版说明里写清迁移步骤。
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: "imresamu/postgis"
        update-types: ["version-update:semver-major"]
